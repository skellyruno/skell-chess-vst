name: Checkmate Windows VST3 and Standalone
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = 'build/Checkmate_artefacts/Release/VST3/Checkmate.vst3'
          $exe = 'build/Checkmate_artefacts/Release/Standalone/Checkmate.exe'
          if (!(Test-Path $vst) -or !(Test-Path $exe)) { throw 'Build outputs missing' }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item $vst package -Recurse
          Copy-Item $exe package
          Copy-Item README.md package
      - uses: actions/upload-artifact@v6
        with:
          name: Checkmate-Windows-x64
          path: package/
          if-no-files-found: error
